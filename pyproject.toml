[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linux-runtime-threat-engine"
version = "0.1.0"
description = "Explainable, read-only Linux process detection and synthetic telemetry replay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<0.12", "mypy>=1.15,<2", "types-PyYAML>=6,<7", "build>=1.2,<2"]

[project.scripts]
runtime-engine = "runtime_engine.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
